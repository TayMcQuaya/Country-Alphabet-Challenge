<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Alphabet Challenge</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <h1>Country Alphabet Challenge</h1>
        <div id="game-content">
            <p id="current-letter">Current Letter: <span>A</span></p>
            <div id="timer">10</div>
            <p id="message">Type a country starting with A</p>
            <input type="text" id="country-input" placeholder="Enter country" autocomplete="off">
        </div>
        <div id="game-state" class="hidden">
            <div id="state-message"></div>
        </div>
        <button id="state-restart-btn" class="state-restart">Restart</button>
    </div>
    <audio id="success-sound" src="success.wav" preload="auto"></audio>
    <audio id="failure-sound" src="failure.wav" preload="auto"></audio>
    <script src="script.js"></script>
</body>
</html>
